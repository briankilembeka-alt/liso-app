name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liso
          POSTGRES_PASSWORD: liso
          POSTGRES_DB: liso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U liso" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://liso:liso@localhost:5432/liso_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleRelease
      - name: Check APK size budget (20 MB per phone)
        run: |
          set -e
          ls -l app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            size=$(stat -c %s "$apk")
            echo "$apk: $((size / 1024)) KB"
            if [ "$size" -gt $((20 * 1024 * 1024)) ]; then
              echo "::error::$apk is over the 20 MB budget"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: liso-apks
          path: android/app/build/outputs/apk/release/*.apk
